<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }} · StockPredict IA</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script src="/static/tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/estilos.css">
  <script src="/static/presentacion.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body class="bg-surface font-body-md text-on-surface">
  <a class="skip" href="#contenido-principal">Saltar al contenido</a>
  <div class="app-shell">
    <header class="app-header">
      <a class="app-brand" href="/" aria-label="StockPredict IA, pantalla principal">
        <span aria-hidden="true" class="marca">SP</span>
        <span class="font-headline-sm text-headline-sm tracking-tight">StockPredict IA</span>
      </a>
      <p class="app-description">Predicción de ventas futuras y recomendaciones de reposición mediante una red neuronal.</p>
      <div class="header-actions">
        <span class="badge">Datos sintéticos</span>
        <button aria-label="Activar tema claro" aria-pressed="true" class="theme-toggle" id="theme-toggle" title="Activar tema claro" type="button">
          <svg aria-hidden="true" class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
          </svg>
          <svg aria-hidden="true" class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"></path>
          </svg>
        </button>
      </div>
    </header>
    <main id="contenido-principal" class="app-main">
      <div class="app-content">{% block contenido %}{% endblock %}</div>
    </main>
    <footer class="app-footer">Las ventas y existencias son sintéticas. La recomendación no modifica inventario ni realiza compras.</footer>
  </div>
</body>
</html>
