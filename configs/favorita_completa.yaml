# Corrida independiente: todas las tiendas/familias; input_dim automatico.
seed: 42
device: cpu
model:
  hidden_dim: 32
  output_dim: 1
training:
  epochs: 10
  batch_size: 256
  learning_rate: 0.001
  num_workers: 0
data:
  source: favorita
  path: data/raw/train.csv
  tiendas: null
  familias: null
output:
  directory: runs/favorita_completa
